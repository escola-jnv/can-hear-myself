<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>Can Hear Myself</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="offline" class="warn">Sem conexão com a mesa</div>

<section id="s-person" class="screen">
  <h1>Quem é você?</h1>
  <div class="list" id="people"></div>
  <button id="new-person" class="btn-action">
    <i data-lucide="user-plus"></i>
    <span>+ Novo nome</span>
  </button>
</section>

<section id="s-instrument" class="screen">
  <h1>O que você está tocando?</h1>
  <div class="instrument-grid" id="instruments"></div>
</section>

<section id="s-aux" class="screen">
  <h1>Qual saída?</h1>
  <div class="list" id="auxes"></div>
</section>

<section id="s-again" class="screen">
  <h1 id="again-text"></h1>
  <div class="list list-actions">
    <button id="again-yes" class="btn-primary">
      <i data-lucide="check"></i>
      <span>Continuar</span>
    </button>
    <button id="again-no" class="btn-secondary">
      <i data-lucide="refresh-cw"></i>
      <span>Trocar</span>
    </button>
  </div>
</section>

<section id="s-mix" class="screen" style="padding:0">
  <div class="top">
    <div class="who">
      <div class="who-main">
        <div class="who-title-line">
          <span id="who-icon" class="who-inst-icon"></span>
          <span id="who-name" class="who-name"></span>
          <span id="dot" class="dot">● Conectado</span>
        </div>
        <small id="who-aux" class="who-aux"></small>
      </div>
      <button class="help-btn" id="help-btn" title="Pedir ajuda ao técnico">
        <i data-lucide="circle-help"></i>
        <span>Ajuda</span>
      </button>
    </div>

    <div class="song">
      <div class="song-title-box">
        <i data-lucide="music-2" class="song-icon"></i>
        <span id="song-name">Nenhuma música</span>
      </div>
      <b id="song-meta"></b>
    </div>

    <div id="fixed"></div>
  </div>

  <div class="groups-container">
    <div id="breadcrumb-bar" class="breadcrumb-bar"></div>
    <div id="groups"></div>
  </div>
</section>

<div class="sheet" id="help-sheet">
  <div class="box">
    <h1>Precisa de ajuda?</h1>
    <div class="help-grid" id="reasons"></div>
    <button id="help-cancel" class="help-cancel-btn">Cancelar</button>
  </div>
</div>

<script src="js/lucide.min.js"></script>
<script src="js/icons.js"></script>
<script src="js/socket.js"></script>
<script src="js/ui/level-row.js"></script>
<script src="js/app.js"></script>
</body>
</html>
