<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>Can Hear Myself</title>
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="offline" class="warn">Sem conexão com a mesa</div>

<section id="s-person" class="screen">
  <h1>Quem é você?</h1>
  <div class="list" id="people"></div>
  <button id="new-person" class="btn-action">
    <i data-lucide="user-plus"></i>
    <span>+ Novo nome</span>
  </button>
</section>

<section id="s-instrument" class="screen">
  <h1>O que você está tocando?</h1>
  <div class="instrument-grid" id="instruments"></div>
</section>

<section id="s-aux" class="screen">
  <h1>Qual saída?</h1>
  <div class="list" id="auxes"></div>
</section>

<section id="s-again" class="screen">
  <h1 id="again-text"></h1>
  <div class="list list-actions">
    <button id="again-yes" class="btn-primary">
      <i data-lucide="check"></i>
      <span>Continuar</span>
    </button>
    <button id="again-no" class="btn-secondary">
      <i data-lucide="refresh-cw"></i>
      <span>Trocar</span>
    </button>
  </div>
</section>

<section id="s-mix" class="screen" style="padding:0">
  <div class="top">
    <div class="who">
      <div class="who-main">
        <span id="who-icon" class="who-inst-icon"></span>
        <span id="who-name" class="who-name"></span>
        <span id="who-aux" class="who-aux"></span>
        <span id="dot" class="dot" title="Conectado"></span>
      </div>
      <div class="who-actions">
        <button class="save-btn" id="save-mix-btn" title="Salvar mix" type="button">
          <i data-lucide="save"></i>
        </button>
        <button class="help-btn" id="help-btn" title="Ajuda do técnico" type="button">
          <i data-lucide="circle-help"></i>
        </button>
      </div>
    </div>

    <div class="song" id="song-box" style="display: none;">
      <div class="song-title-box">
        <i data-lucide="music-2" class="song-icon"></i>
        <span id="song-name"></span>
      </div>
      <b id="song-meta"></b>
    </div>

    <div id="fixed"></div>
  </div>

  <div class="groups-container">
    <div id="breadcrumb-bar" class="breadcrumb-bar"></div>
    <div id="groups"></div>
  </div>
</section>

<div class="sheet" id="help-sheet">
  <div class="box">
    <h1>Precisa de ajuda?</h1>
    <div class="help-grid" id="reasons"></div>
    <button id="help-cancel" class="help-cancel-btn">Cancelar</button>
  </div>
</div>

<div class="sheet" id="reorder-sheet">
  <div class="box reorder-box">
    <div class="reorder-header">
      <h2>Organizar canais</h2>
      <button class="sheet-close-btn" id="reorder-close-btn" type="button" title="Fechar">
        <i data-lucide="x"></i>
      </button>
    </div>
    <p class="reorder-hint">Fixe canais no topo (📌) ou altere a ordem dos canais.</p>
    <div class="reorder-list" id="reorder-items"></div>
    <div class="reorder-footer">
      <button id="reorder-reset-btn" type="button" class="btn-secondary reorder-reset-btn">
        <i data-lucide="rotate-ccw"></i>
        <span>Padrão</span>
      </button>
      <button id="reorder-done-btn" type="button" class="btn-primary reorder-done-btn">
        <i data-lucide="check"></i>
        <span>Concluir</span>
      </button>
    </div>
  </div>
</div>

<script src="js/lucide-lite.js"></script>
<script src="js/icons.js"></script>
<script src="js/socket.js"></script>
<script src="js/ui/level-row.js"></script>
<script src="js/app.js"></script>
</body>
</html>
