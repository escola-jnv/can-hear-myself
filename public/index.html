<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0E1116">
<title>Can Hear Myself</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="offline" class="warn">Sem conexão com a mesa</div>

<section id="s-person" class="screen"><h1>Quem é você?</h1><div class="list" id="people"></div>
  <button id="new-person">+ Novo nome</button></section>
<section id="s-instrument" class="screen"><h1>O que você está tocando?</h1><div class="list" id="instruments"></div></section>
<section id="s-aux" class="screen"><h1>Qual saída?</h1><div class="list" id="auxes"></div></section>
<section id="s-again" class="screen"><h1 id="again-text"></h1>
  <div class="list"><button id="again-yes">Continuar</button><button id="again-no">Trocar</button></div></section>

<section id="s-mix" class="screen" style="padding:0">
  <div class="top">
    <div class="who"><div><div id="who-name"></div><small id="who-aux" style="color:var(--text-2)"></small></div><span id="dot" class="dot">● Conectado</span></div>
    <div class="song"><span id="song-name">Nenhuma música</span><b id="song-meta"></b></div>
    <div id="fixed"></div>
  </div>
  <div id="groups" style="padding:8px 16px 80px"></div>
  <button class="help" id="help-btn">Ajuda</button>
</section>

<div class="sheet" id="help-sheet"><div class="box"><h1>O que aconteceu?</h1><div class="list" id="reasons"></div>
  <button id="help-cancel">Cancelar</button></div></div>

<script src="js/socket.js"></script>
<script src="js/ui/level-row.js"></script>
<script src="js/app.js"></script>
</body>
</html>
