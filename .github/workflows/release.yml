name: Release Executables

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publicar Executáveis Windows
    runs-on: windows-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Executar testes automatizados
        run: npm test

      - name: Compilar executáveis (.exe)
        run: npm run build:exe

      - name: Gerar notas de release
        id: notes
        shell: pwsh
        run: |
          $isTag = "${{ github.ref }}".StartsWith("refs/tags/v")
          $tag = if ($isTag) { "${{ github.ref_name }}" } else { "latest" }
          $version = $tag -replace '^v',''
          $changelogFile = "docs/changelogs/$version.json"
          
          $body = ""
          if (Test-Path "ai/docs/releases/Release_CommitCloud.md") {
            $body = Get-Content "ai/docs/releases/Release_CommitCloud.md" -Raw -Encoding UTF8
          } elseif (Test-Path $changelogFile) {
            $json = Get-Content $changelogFile -Raw -Encoding UTF8 | ConvertFrom-Json
            $body = "# $tag — $($json.name)`n`n"
            if ($json.highlights) {
              $body += "## ✨ Destaques`n"
              foreach ($h in $json.highlights) { $body += "- $h`n" }
              $body += "`n"
            }
            if ($json.items) {
              $body += "## 🔧 Alterações`n"
              foreach ($it in $json.items) {
                $body += "- **$($it.audience) $($it.area):** $($it.text)`n"
              }
              $body += "`n"
            }
          } else {
            $body = "# Can Hear Myself - Executável Windows ($tag)`n`nVersão gerada automaticamente a partir do código mais recente."
          }

          $body += "`n`n---`n### 📥 Download do Executável (Apenas o EXE)`n`n"
          $body += "Para usar na igreja sem precisar baixar o código ou instalar o Node.js:`n"
          $body += "1. Baixe **can-hear-myself.exe** abaixo.`n"
          $body += "2. Dê dois cliques para abrir o Painel do Técnico direto no Windows.`n"
          $body += "3. (Opcional) Baixe **can-hear-myself-cli.exe** se quiser rodar com terminal e logs visíveis.`n"

          Set-Content -Path "RELEASE_BODY.md" -Value $body -Encoding UTF8

      - name: Atualizar tag latest no Git (se for push na branch main)
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest ${{ github.sha }}
          git push -f origin latest

      - name: Publicar Release no GitHub com os executáveis
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Can Hear Myself — Versão Mais Recente (EXE)' }}
          target_commitish: ${{ github.sha }}
          body_path: RELEASE_BODY.md
          files: |
            can-hear-myself.exe
            can-hear-myself-cli.exe
          draft: false
          prerelease: false
          make_latest: true
